name: ohos-signalr-verify

# Targeted build/test gate for the SignalR authentication-refresh fix
# (upstream #70452, CVE-2026-109481) on the OpenHarmony fork.
#
# The fork's default branch does not run the upstream Azure DevOps build, and
# the OpenHarmony host cannot run eng/build.sh (it rejects non-Linux hosts).
# This job uses a GitHub-hosted Linux runner to compile the SignalR client and
# dispatcher test projects, run their tests, compile the Blazor auth test
# assets, and run the TypeScript client tests.
#
# Manual-only on purpose: a first run restores the repo toolset and is
# expensive, and the OpenHarmony branch mostly receives upstream merges.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signalr-csharp:
    name: SignalR C# build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out aspnetcore-ohos
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ohos-signalr-nuget-${{ hashFiles('global.json', 'eng/Versions.props', 'eng/Version.Details.xml') }}
          restore-keys: ohos-signalr-nuget-

      - name: Build SignalR client and test projects
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: |
          ./eng/build.sh --ci --nobl --no-build-java \
            --projects "$PWD/src/SignalR/clients/csharp/Http.Connections.Client/src/Microsoft.AspNetCore.Http.Connections.Client.csproj;$PWD/src/SignalR/common/Http.Connections/test/Microsoft.AspNetCore.Http.Connections.Tests.csproj;$PWD/src/SignalR/clients/csharp/Client/test/UnitTests/Microsoft.AspNetCore.SignalR.Client.Tests.csproj"

      - name: Run SignalR tests
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: |
          ./eng/build.sh --ci --nobl --no-build --no-build-java --test \
            --projects "$PWD/src/SignalR/common/Http.Connections/test/Microsoft.AspNetCore.Http.Connections.Tests.csproj;$PWD/src/SignalR/clients/csharp/Client/test/UnitTests/Microsoft.AspNetCore.SignalR.Client.Tests.csproj"

      - name: Upload build/test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signalr-csharp-logs
          path: artifacts/log
          if-no-files-found: warn

  components-compile:
    name: Blazor auth test assets (compile)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out aspnetcore-ohos
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ohos-signalr-nuget-${{ hashFiles('global.json', 'eng/Versions.props', 'eng/Version.Details.xml') }}
          restore-keys: ohos-signalr-nuget-

      - name: Build Components test assets
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: |
          ./eng/build.sh --ci --nobl --no-build-java \
            --projects "$PWD/src/Components/test/testassets/Components.TestServer/Components.TestServer.csproj;$PWD/src/Components/test/testassets/BasicTestApp/BasicTestApp.csproj;$PWD/src/Components/test/E2ETest/Microsoft.AspNetCore.Components.E2ETests.csproj"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: components-compile-logs
          path: artifacts/log
          if-no-files-found: warn

  signalr-typescript:
    name: SignalR TypeScript build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out aspnetcore-ohos
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build TS clients
        run: |
          cd src/SignalR/clients/ts
          npm install --no-audit --no-fund
          (cd signalr && npm install --no-audit --no-fund && npm run build)
          (cd signalr-protocol-msgpack && npm install --no-audit --no-fund && npm run build)

      - name: Run TS tests
        run: |
          cd src/SignalR/clients/ts
          npm test -- --ci

      - name: Upload TS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signalr-typescript-results
          path: artifacts/log
          if-no-files-found: warn
